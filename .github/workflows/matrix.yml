name: Matrix Testing for Bai04

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4 # Nâng lên v4 cho ổn định

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # Nâng lên v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
      
        run: mvn -B package